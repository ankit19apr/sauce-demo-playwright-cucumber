
# Name displayed in the GitHub Actions tab
name: Playwright Cucumber BDD Tests

# Workflow triggers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Grant only read access to repository contents
permissions:
  contents: read

# Cancel older runs for the same branch or pull request
concurrency:
  group: cucumber-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cucumber-bdd:
    name: Cucumber BDD — UI and API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      AUTH_API_USERNAME: ${{ secrets.AUTH_API_USERNAME }}
      AUTH_API_PASSWORD: ${{ secrets.AUTH_API_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint code quality check
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs both UI and API Cucumber scenarios.
      # The HTML and JSON formatters are configured in cucumber.js.
      - name: Run Cucumber scenarios
        run: npm test

      # Generate the richer dashboard from the JSON report.
      # Skip only when the JSON report does not exist.
      - name: Generate Cucumber HTML dashboard
        if: ${{ always() && hashFiles('cucumber-report.json') != '' }}
        run: npm run report:cucumber

      # Upload reports even when tests or report generation fail.
      - name: Upload Cucumber reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-test-reports
          path: |
            cucumber-report.json
            cucumber-report.html
            cucumber-html-report/
          if-no-files-found: warn
          retention-days: 14

      # Preserve debugging evidence when a job step fails.
      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-failure-evidence
          path: |
            test-results/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14
